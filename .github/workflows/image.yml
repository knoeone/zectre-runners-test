name: zectre-runner-image
on:
  workflow_dispatch:
  push:
    paths: [runner-image/**]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: runner-image
          push: true
          tags: |
            ghcr.io/knoeone/zectre-runner:latest
            ghcr.io/knoeone/zectre-runner:${{ github.sha }}
